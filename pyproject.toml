[project]
name = "aereo-assignment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dhwanil Shah", email = "itzdhwanil@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.6,<3",
    "taskiq==0.13.0",
    "taskiq-redis==1.2.4",
    "reportlab>=4.2,<6",
    "segno>=1.6,<2",
    "redis>=5,<9",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=0.25",
    "httpx>=0.27",
    "testcontainers[postgres,redis]>=4.9",
    "pypdf>=5",
    "ruff",
    "psycopg[binary]>=3.3,<4",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
